version: '3.8'

services:
  # Base de Datos Vectorial: Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - /mnt/expansion/dockers_drives/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # Grafo de Conocimiento: Neo4j
  neo4j:
    image: neo4j:5.23
    container_name: neo4j
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:7474:7474" # Browser GUI
      - "127.0.0.1:7687:7687" # Bolt connection
    volumes:
      - /mnt/expansion/dockers_drives/neo4j_data:/data
      - /mnt/expansion/dockers_drives/neo4j_logs:/logs
      - /mnt/expansion/dockers_drives/neo4j_import:/var/lib/neo4j/import
      - /mnt/expansion/dockers_drives/neo4j_plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=8G
      - NEO4J_server_memory_heap_max__size=16G
      - NEO4J_server_memory_pagecache_size=32G
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    restart: unless-stopped

  # Grafo de Conocimiento (México): Neo4j Nueva Instancia
    neo4j_mexico:
    image: neo4j:5.23
    container_name: neo4j_mexico
    # QUITAMOS user y userns_mode
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - /mnt/expansion/dockers_drives/neo4j_mexico_data:/data
      - /mnt/expansion/dockers_drives/neo4j_mexico_logs:/logs
      - /mnt/expansion/dockers_drives/neo4j_mexico_import:/import # Simplificado
      - /mnt/expansion/dockers_drives/neo4j_mexico_plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc", "gds"]
      - NEO4J_CHOWN_DIRECTORIES=false
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      # ... resto de variables ...
      - NEO4J_server_memory_heap_initial__size=8G
      - NEO4J_server_memory_heap_max__size=16G
      - NEO4J_server_memory_pagecache_size=32G
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_CHOWN_DIRECTORIES=false
    restart: unless-stopped

  # Servidor MCP para Neo4j (México)
  neo4j_mcp_mexico:
    image: python:3.11-slim
    container_name: neo4j_mcp_mexico
    environment:
      - NEO4J_URI=bolt://neo4j_mexico:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    command: >
      bash -c "pip install mcp-neo4j-cypher && 
               mcp-neo4j-cypher --transport http --port 8000"
    ports:
      - "127.0.0.1:8005:8000"
    depends_on:
      - neo4j_mexico
    restart: unless-stopped

  # Procesamiento de PDFs: Grobid
  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: grobid
    ports:
      - "127.0.0.1:8070:8070"
    environment:
      - JAVA_OPTS=-Xmx4g
    restart: unless-stopped
  # Procesamiento no estructurado general
  unstructured-api:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    container_name: unstructured-api
    ports:
      - "127.0.0.1:8004:8000"
    restart: unless-stopped

  # ClickHouse: Almacenamiento OLAP para metadatos masivos (ORCID/OpenAlex)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    user: "1001:1001"
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9001:9000"
    volumes:
      - /mnt/expansion/dockers_drives/clickhouse:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=openalex
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=admin
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
